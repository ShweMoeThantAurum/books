<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reading Journal</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg:#faf9f6; --sidebar-bg:#f0ede8; --border:#e0dbd3; --text:#2c2c2c; --text-muted:#888;
    --accent:#c97d4e; --accent-light:#f5ebe0;
    --badge-toread:#e8e0d5; --badge-reading:#d4e8f5; --badge-finished:#d5e8d5;
    --badge-toread-text:#7a6a5a; --badge-reading-text:#2a6a9a; --badge-finished-text:#2a7a2a;
    --sidebar-w:300px; --radius:10px; --shadow:0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:center; justify-content:space-between; padding:0 18px; height:56px; background:var(--bg); border-bottom:1px solid var(--border); flex-shrink:0; gap:12px; }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .topbar h1 { font-size:17px; font-weight:700; font-family:Georgia,serif; letter-spacing:-0.3px; white-space:nowrap; }
  .topbar h1 span { color:var(--accent); }
  .hamburger { display:none; background:none; border:none; cursor:pointer; padding:4px; color:var(--text); }
  .hamburger svg { display:block; }
  .nav-tabs { display:flex; gap:2px; }
  .nav-tabs button { background:none; border:none; font-size:14px; font-weight:600; color:var(--text-muted); padding:7px 12px; border-radius:8px; cursor:pointer; }
  .nav-tabs button:hover { background:var(--sidebar-bg); }
  .nav-tabs button.active { color:var(--accent); background:var(--accent-light); }
  .topbar-actions { display:flex; gap:8px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; transition:opacity .15s; }
  .btn:hover { opacity:.85; }
  .btn-ghost { background:none; color:var(--text-muted); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--sidebar-bg); opacity:1; }
  .btn-sm { padding:6px 11px; font-size:13px; }

  #content { flex:1; overflow:hidden; position:relative; }
  .page { position:absolute; inset:0; overflow-y:auto; display:none; }
  .page.show { display:block; }
  #viewLibrary.show { display:flex; overflow:hidden; padding:0; }
  .wrap { max-width:760px; margin:0 auto; padding:30px 24px 70px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); }
  .page-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .search-bar { width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:10px; background:#fff; font-size:14px; color:var(--text); outline:none; margin-bottom:18px; }
  .search-bar:focus { border-color:var(--accent); }

  .home-title { font-family:Georgia,serif; font-size:30px; line-height:1.2; margin-top:8px; }
  .home-author { color:var(--text-muted); margin:6px 0 14px; font-size:15px; }
  .reading-pills { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .pill { border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:20px; padding:5px 12px; font-size:13px; cursor:pointer; font-family:Georgia,serif; }
  .pill.active { background:var(--accent-light); border-color:var(--accent); color:var(--accent); }
  .status-row { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .status-select { padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); font-size:13px; font-weight:600; color:var(--text); cursor:pointer; outline:none; }
  .status-select:focus { border-color:var(--accent); }
  .home-foot { margin-top:22px; display:flex; gap:20px; flex-wrap:wrap; }
  .home-foot a { color:var(--accent); cursor:pointer; font-weight:600; font-size:14px; }
  .home-foot a:hover { text-decoration:underline; }
  .save-status { font-size:13px; color:var(--text-muted); }
  .save-status.saved { color:#4caf7d; }

  .notes-editor { width:100%; min-height:44vh; padding:18px; border:1px solid var(--border); border-radius:14px; font-size:16px; line-height:1.8; background:#fff; font-family:inherit; outline:none; resize:vertical; color:var(--text); }
  .notes-editor:focus { border-color:var(--accent); }
  .syntax-hint { font-size:13px; color:var(--text-muted); margin-top:10px; line-height:1.7; }
  .syntax-hint code { background:var(--sidebar-bg); padding:1px 6px; border-radius:5px; font-size:12px; }

  .suggest-grid { display:flex; flex-direction:column; gap:16px; }
  .suggest-card { display:flex; gap:16px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s; }
  .suggest-card:hover { transform:translateY(-2px); }
  .suggest-cover { width:74px; height:108px; flex-shrink:0; border-radius:6px; background-size:cover; background-position:center; background-color:var(--sidebar-bg); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-family:Georgia,serif; font-size:26px; }
  .suggest-body { min-width:0; }
  .suggest-body h3 { font-family:Georgia,serif; font-size:18px; line-height:1.25; }
  .suggest-body .meta { font-size:13px; color:var(--text-muted); margin:4px 0 8px; }
  .suggest-summary { font-size:13px; color:var(--text); line-height:1.6; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }

  .feed { display:flex; flex-direction:column; gap:22px; }
  .feed-card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:22px 24px; box-shadow:var(--shadow); }
  .feed-top { display:flex; gap:14px; margin-bottom:14px; }
  .feed-cover { width:54px; height:80px; flex-shrink:0; border-radius:5px; background-size:cover; background-position:center; background-color:var(--sidebar-bg); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-family:Georgia,serif; }
  .feed-card h3 { font-family:Georgia,serif; font-size:20px; line-height:1.25; }
  .feed-card .meta { font-size:13px; color:var(--text-muted); margin-top:4px; }
  .feed-actions { margin-top:16px; }
  .feed-none { color:var(--text-muted); font-style:italic; font-size:14px; }
  .feed-empty { text-align:center; color:var(--text-muted); padding:60px 20px; font-size:15px; }

  .notes-view { display:flex; flex-direction:column; gap:14px; }
  .nv-empty { color:var(--text-muted); font-style:italic; }
  .nv-note { font-size:15px; line-height:1.8; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
  .nv-note a { color:var(--accent); }
  .nv-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
  .nv-list li { position:relative; padding-left:22px; font-size:15px; line-height:1.7; word-wrap:break-word; overflow-wrap:anywhere; }
  .nv-list li::before { content:'›'; position:absolute; left:5px; top:-1px; color:var(--accent); font-weight:700; font-size:16px; }
  .nv-list li a { color:var(--accent); }
  .nv-quote { font-family:Georgia,serif; font-style:italic; font-size:16px; line-height:1.7; padding:10px 18px; border-left:3px solid var(--accent); background:var(--accent-light); border-radius:0 10px 10px 0; white-space:pre-wrap; }
  .nv-quote::before { content:'"'; color:var(--accent); margin-right:3px; }
  .nv-link { display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:10px; text-decoration:none; color:var(--text); background:var(--bg); transition:background .12s; }
  .nv-link:hover { background:var(--accent-light); }
  .nv-fav { width:18px; height:18px; flex-shrink:0; border-radius:3px; }
  .nv-link-label { flex:1; font-size:14px; min-width:0; }
  .nv-link-dom { font-size:12px; color:var(--text-muted); flex-shrink:0; white-space:nowrap; }

  .about-box { display:flex; gap:16px; background:var(--sidebar-bg); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .about-cover { width:72px; height:104px; flex-shrink:0; border-radius:6px; background-size:cover; background-position:center; background-color:var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-family:Georgia,serif; font-size:24px; }
  .about-body { min-width:0; }
  .about-label { font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
  .about-summary { font-size:13px; line-height:1.65; color:var(--text); display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }

  .sidebar { width:var(--sidebar-w); background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; transition:transform .25s ease; }
  .sidebar-search { padding:12px; border-bottom:1px solid var(--border); }
  .sidebar-search input { width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); font-size:14px; color:var(--text); outline:none; }
  .sidebar-search input:focus { border-color:var(--accent); }
  .sidebar-list { flex:1; overflow-y:auto; padding:8px 0; }
  .status-group { margin-bottom:4px; }
  .status-label { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--text-muted); padding:8px 16px 4px; }
  .book-item { padding:10px 16px; cursor:pointer; border-radius:8px; margin:1px 8px; transition:background .1s; display:flex; align-items:flex-start; gap:10px; }
  .book-item:hover { background:var(--border); }
  .book-item.active { background:var(--accent-light); }
  .book-item-info { flex:1; min-width:0; }
  .book-item-title { font-size:14px; font-weight:600; font-family:Georgia,serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .book-item-author { font-size:12px; color:var(--text-muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-dot { color:var(--accent); font-size:11px; }
  .badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; white-space:nowrap; flex-shrink:0; margin-top:2px; }
  .badge-toread { background:var(--badge-toread); color:var(--badge-toread-text); }
  .badge-reading { background:var(--badge-reading); color:var(--badge-reading-text); }
  .badge-finished { background:var(--badge-finished); color:var(--badge-finished-text); }
  .main { flex:1; overflow-y:auto; padding:32px; display:flex; flex-direction:column; gap:20px; }
  .empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); gap:12px; text-align:center; }
  .empty-state .icon { font-size:48px; }
  .book-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .book-title-area h2 { font-size:26px; font-family:Georgia,serif; font-weight:700; line-height:1.2; }
  .book-title-area .author { font-size:15px; color:var(--text-muted); margin-top:4px; }
  .book-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .divider { border:none; border-top:1px solid var(--border); }
  .note-section { display:flex; flex-direction:column; gap:10px; }
  .note-section > label { font-size:13px; font-weight:700; letter-spacing:.4px; color:var(--text-muted); text-transform:uppercase; }

  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .overlay.open { display:flex; }
  .modal { background:var(--bg); border-radius:14px; padding:28px; width:100%; max-width:480px; box-shadow:0 8px 40px rgba(0,0,0,.15); display:flex; flex-direction:column; gap:16px; max-height:88vh; overflow-y:auto; }
  .modal h3 { font-size:18px; font-family:Georgia,serif; }
  .modal-field { display:flex; flex-direction:column; gap:6px; }
  .modal-field label { font-size:13px; font-weight:600; color:var(--text-muted); }
  .modal-field input, .modal-field select { padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:#fff; color:var(--text); outline:none; }
  .modal-field input:focus, .modal-field select:focus { border-color:var(--accent); }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; flex-wrap:wrap; }
  .modal-tools { display:flex; gap:8px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:14px; }
  .conn-status { font-size:13px; font-weight:600; padding:8px 12px; border-radius:8px; background:var(--sidebar-bg); }
  .conn-ok { color:#4caf7d; }
  .conn-err { color:#e05555; }

  @media (max-width:720px) {
    .topbar h1 { display:none; }
    .nav-tabs button { padding:7px 9px; font-size:13px; }
    .btn { padding:7px 11px; }
    .wrap { padding:22px 16px 60px; }
    .home-title { font-size:24px; }
    .book-title-area h2 { font-size:21px; }
    .sidebar { position:absolute; top:0; left:0; bottom:0; z-index:50; transform:translateX(-100%); width:80vw; max-width:300px; }
    .sidebar.open { transform:translateX(0); box-shadow:4px 0 20px rgba(0,0,0,.12); }
    body.in-library .hamburger { display:block; }
    .main { padding:20px 16px; }
    .overlay-sidebar { display:none; position:absolute; inset:0; background:rgba(0,0,0,.2); z-index:49; }
    .overlay-sidebar.open { display:block; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect y="4" width="22" height="2" rx="1" fill="currentColor"/><rect y="10" width="22" height="2" rx="1" fill="currentColor"/><rect y="16" width="22" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <h1>My <span>Reading</span> Journal</h1>
  </div>
  <nav class="nav-tabs">
    <button data-view="home" onclick="setView('home')">Home</button>
    <button data-view="feed" onclick="setView('feed')">Notes</button>
    <button data-view="library" onclick="setView('library')">Library</button>
  </nav>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" onclick="openSetup()">⚙</button>
    <button class="btn btn-sm" onclick="openAddBook()">+ Add</button>
  </div>
</div>

<div id="content">
  <div id="viewHome" class="page"></div>
  <div id="viewFeed" class="page"></div>
  <div id="viewLibrary" class="page">
    <div class="overlay-sidebar" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-search"><input type="text" id="searchInput" placeholder="Search books..." oninput="renderSidebar()"></div>
      <div class="sidebar-list" id="sidebarList"></div>
    </aside>
    <main class="main">
      <div class="empty-state" id="libEmpty"><div class="icon">📚</div><p>Select a book to view or edit,<br>or add a new one.</p></div>
      <div id="bookDetail" style="display:none;"></div>
    </main>
  </div>
</div>

<!-- ADD BOOK MODAL -->
<div class="overlay" id="addModal">
  <div class="modal">
    <h3>Add a Book</h3>
    <div class="modal-field"><label>Title *</label><input type="text" id="newTitle" placeholder="Book title"></div>
    <div class="modal-field"><label>Author</label><input type="text" id="newAuthor" placeholder="Author name"></div>
    <div class="modal-field"><label>Language</label><select id="newLang"><option value="English">English</option><option value="Burmese">Burmese</option><option value="Other">Other</option></select></div>
    <div class="modal-field"><label>Status</label><select id="newStatus"><option value="toread">To Read</option><option value="reading">Currently Reading</option><option value="finished">Finished</option></select></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeAddBook()">Cancel</button><button class="btn" onclick="addBook()">Add Book</button></div>
  </div>
</div>

<!-- DATA MODAL -->
<div class="overlay" id="setupModal">
  <div class="modal">
    <h3>⚙ Data</h3>
    <p style="font-size:14px;color:var(--text-muted);line-height:1.6;">Your books sync automatically to Firebase Firestore. Download a backup or import a previous one at any time.</p>
    <div class="conn-status" id="connStatus">Checking connection…</div>
    <div class="modal-tools">
      <button class="btn btn-ghost btn-sm" onclick="exportJson()">⬇ Download backup</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">⬆ Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJson(event)">
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeSetup()">Close</button></div>
  </div>
</div>

<script>
// ─── FIREBASE ─────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyAu8sfOZQNbbzvuSDCGZ3vg1Ne919wm-v8",
  authDomain: "reading-journal-d4839.firebaseapp.com",
  projectId: "reading-journal-d4839",
  storageBucket: "reading-journal-d4839.firebasestorage.app",
  messagingSenderId: "806612897171",
  appId: "1:806612897171:web:8e1efa2d49fd41dc73ac66"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const DOC = db.collection('journal').doc('main');

// ─── STATE ────────────────────────────────────────────────
let books=[], currentView='home', activeId=null, editMode=false, homeReadingId=null, localSaveTimer=null;
const STORAGE_KEY='reading_journal_books';
const INFO_PREFIX='bk_info_v2_';

// ─── SEED ─────────────────────────────────────────────────
const seedBooks = [
  { id:uid(), title:"အိမ်မပြန်ဖြစ်တဲ့အကြောင်းတွေ", author:"လူခါး", lang:"Burmese", status:"finished", notes:"ဂျပန်ရောက်မြန်မာနိုင်ငံသားတစ်ဦးရဲ့ အတွေ့အကြုံများ\nဇာတ်ကားတစ်ပုဒ်လိုရေးထား\nPlot တင်ပြပုံကောင်း" },
  { id:uid(), title:"အနတ္တအင်နားရှား", author:"အေးမင်းစော", lang:"Burmese", status:"finished", notes:"မိဘတွေခေတ် ၁၉၅၀-၁၉၆၀ ဖွားတွေရဲ့ ဖြတ်သန်းမှုကိုလေ့လာနိုင်\nမြန်မာနိုင်ငံရဲ့ နေဝင်းအာဏာသိမ်းပြီး ဖြတ်သန်းမှု ခေတ်အဆက်ဆက်ကိုလေ့လာနိုင်" },
  { id:uid(), title:"တိမ်ပုခက်လွှဲတဲ့ အိပ်မက်ကလေးတွေ အက်ဆေးစုစည်းမှု", author:"မောင်သာချို", lang:"Burmese", status:"finished", notes:"အက်ဆေးတွေရဲ့အရေးပါပုံကို သိရ\nအက်ဆေးတွေဖတ်ချင်စိတ်ဖြစ်ပေါ်လာအောင်ပေးနိုင်" },

  { id:uid(), title:"Doublespeak", author:"William D. Lutz", lang:"English", status:"finished", notes:"ကြော်ငြာတွေရဲ့ စကားလုံးအသုံးချပုံ အလိမ်အငြာများ\nနိုင်ငံရေးသမားတွေရဲ့ စကားလုံးရွေးခြယ်မှု ပရိယာလ်များ စသည်ဖြင့်" },

// ─── UTILS ────────────────────────────────────────────────
function uid(){ return '_'+Math.random().toString(36).substr(2,9); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; } }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hasNotes(b){ return b.notes && b.notes.trim(); }

function normalize(b){
  if(Array.isArray(b.entries)){
    b.notes=b.entries.map(e=>{
      if(e.type==='quote') return (e.text||'').split('\n').map(x=>'> '+x).join('\n');
      if(e.type==='link') return '@ '+(e.url||'')+(e.text?' '+e.text:'');
      return e.text||'';
    }).filter(x=>x).join('\n');
    delete b.entries; return true;
  }
  if(b.notes===undefined){ b.notes=''; return true; }
  return false;
}
function normalizeAll(){ let ch=false; books.forEach(b=>{ if(normalize(b)) ch=true; }); if(ch) saveLocal(); return ch; }

// ─── NOTE DISPLAY ─────────────────────────────────────────
function renderNotes(text){
  if(!text||!text.trim()) return '<div class="nv-empty">No notes yet.</div>';
  const lines=text.split('\n');
  const isQuote=l=>/^\s*>\s?/.test(l);
  const isLink=l=>/^\s*@\s+/.test(l);
  const isItem=l=>/^\s*-\s+/.test(l);
  let html='', i=0;
  while(i<lines.length){
    if(lines[i].trim()===''){ i++; continue; }
    if(isQuote(lines[i])){
      const buf=[];
      while(i<lines.length && isQuote(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      html+=`<blockquote class="nv-quote">${linkify(buf.join('\n'))}</blockquote>`;
    } else if(isLink(lines[i])){
      const rest=lines[i].replace(/^\s*@\s+/,''); i++;
      const m=rest.match(/(https?:\/\/[^\s]+)/);
      const url=m?m[1]:'';
      let label=rest.replace(url,'').replace(/^[\s|—–\-:]+|[\s|—–\-:]+$/g,'').trim();
      if(url){
        const dom=domainOf(url); if(!label) label=dom;
        html+=`<a class="nv-link" href="${esc(url)}" target="_blank" rel="noopener"><img class="nv-fav" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(dom)}&sz=64" alt=""><span class="nv-link-label">${esc(label)}</span><span class="nv-link-dom">${esc(dom)}</span></a>`;
      } else { html+=`<div class="nv-note">${linkify(rest)}</div>`; }
    } else if(isItem(lines[i])){
      const items=[];
      while(i<lines.length && isItem(lines[i])){ items.push(lines[i].replace(/^\s*-\s+/,'')); i++; }
      html+=`<ul class="nv-list">${items.map(t=>`<li>${linkify(t)}</li>`).join('')}</ul>`;
    } else {
      const buf=[];
      while(i<lines.length && lines[i].trim()!=='' && !isQuote(lines[i]) && !isLink(lines[i]) && !isItem(lines[i])){ buf.push(lines[i].replace(/^\s*[•\*▪◦·]\s*/,'')); i++; }
      html+=`<div class="nv-note">${linkify(buf.join('\n'))}</div>`;
    }
  }
  return `<div class="notes-view">${html}</div>`;
}

const SYNTAX_HINT='Start a line with <code>-</code> for a point, <code>&gt;</code> for a quote, <code>@ https://… description</code> for a link, or just type a note.';

// ─── BOOK INFO (Open Library) ─────────────────────────────
async function fetchBookInfo(b){
  const key=INFO_PREFIX+(b.title||'')+'|'+(b.author||'');
  try{ const c=localStorage.getItem(key); if(c) return JSON.parse(c); }catch(e){}
  const res={cover:'',summary:''};
  try{
    const q=`title=${encodeURIComponent(b.title)}${b.author?`&author=${encodeURIComponent(b.author)}`:''}`;
    const r=await fetch(`https://openlibrary.org/search.json?${q}&limit=1&fields=cover_i,isbn,key,first_sentence`);
    const d=await r.json(); const doc=d.docs&&d.docs[0];
    if(doc){
      if(doc.cover_i) res.cover=`https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`;
      else if(doc.isbn&&doc.isbn[0]) res.cover=`https://covers.openlibrary.org/b/isbn/${doc.isbn[0]}-M.jpg`;
      if(doc.first_sentence&&doc.first_sentence[0]) res.summary=doc.first_sentence[0];
      if(doc.key){ try{ const wr=await fetch(`https://openlibrary.org${doc.key}.json`); const wd=await wr.json(); let desc=wd.description; if(desc&&typeof desc==='object') desc=desc.value; if(desc) res.summary=desc; }catch(e){} }
    }
    try{ localStorage.setItem(key,JSON.stringify(res)); }catch(e){}
  }catch(e){}
  return res;
}
async function hydrateBookInfo(items){
  for(const it of items){
    const info=await fetchBookInfo(it.book);
    if(it.coverId){ const el=document.getElementById(it.coverId); if(el){ if(info.cover){ el.style.backgroundImage=`url("${info.cover}")`; el.textContent=''; } else el.textContent=(it.book.title||'?').charAt(0); } }
    if(it.summaryId){ const el=document.getElementById(it.summaryId); if(el) el.textContent=info.summary||'No summary found on Open Library.'; }
  }
}

// ─── FIRESTORE SYNC ───────────────────────────────────────
async function syncToFirestore(){
  try{ await DOC.set({ books }); }
  catch(e){ console.error('Firestore sync failed',e); }
}

function setConnStatus(ok){
  const el=document.getElementById('connStatus'); if(!el) return;
  el.textContent=ok?'Connected to Firestore ✓':'Offline — changes saved locally only';
  el.className='conn-status '+(ok?'conn-ok':'conn-err');
}

// ─── INIT ─────────────────────────────────────────────────
async function init(){
  const stored=localStorage.getItem(STORAGE_KEY);
  if(stored) books=JSON.parse(stored);
  else books=seedBooks.map(b=>({...b}));
  normalizeAll();
  setView('home');
  try{
    const snap=await DOC.get();
    if(snap.exists){
      const data=snap.data();
      if(data.books&&data.books.length){ books=data.books; normalizeAll(); saveLocal(); setView(currentView); }
    } else {
      await syncToFirestore(); // first run: push seed to Firestore
    }
    setConnStatus(true);
  } catch(e){
    console.error('Firestore init failed',e);
    setConnStatus(false);
  }
}
function saveLocal(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(books)); }

function scheduleSave(){
  const ind=document.getElementById('saveInd')||document.getElementById('saveStatus');
  if(ind){ ind.textContent='Saving…'; ind.className='save-status'; }
  clearTimeout(localSaveTimer);
  localSaveTimer=setTimeout(async()=>{
    saveLocal(); await syncToFirestore();
    const i2=document.getElementById('saveInd')||document.getElementById('saveStatus');
    if(i2){ i2.textContent='Saved ✓'; i2.className='save-status saved'; }
  },600);
}

// ─── VIEW SWITCHING ───────────────────────────────────────
function setView(v){
  currentView=v;
  ['home','feed','library'].forEach(n=>document.getElementById('view'+cap(n)).classList.toggle('show',n===v));
  document.querySelectorAll('.nav-tabs button').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===v));
  document.body.classList.toggle('in-library',v==='library');
  closeSidebar();
  if(v==='home') renderHome(); else if(v==='feed') renderFeed(); else renderLibrary();
}

function editingBook(){ const id=currentView==='home'?homeReadingId:activeId; return books.find(b=>b.id===id); }
function notesInput(){ const b=editingBook(); if(!b) return; const ta=document.getElementById('notesArea'); if(ta) b.notes=ta.value; scheduleSave(); }

// ─── HOME ─────────────────────────────────────────────────
function renderHome(){
  const el=document.getElementById('viewHome');
  const reading=books.filter(b=>b.status==='reading');
  if(reading.length){
    if(!homeReadingId||!reading.find(b=>b.id===homeReadingId)) homeReadingId=reading[0].id;
    const b=reading.find(x=>x.id===homeReadingId);
    const pills=reading.length>1?`<div class="reading-pills">${reading.map(r=>`<button class="pill ${r.id===homeReadingId?'active':''}" onclick="homeSwitch('${r.id}')">${esc(r.title)}</button>`).join('')}</div>`:'';
    el.innerHTML=`<div class="wrap"><span class="eyebrow">Currently reading</span>${pills}
      <h2 class="home-title">${esc(b.title)}</h2>
      <div class="home-author">${esc(b.author)||'Unknown author'} &nbsp;·&nbsp; ${esc(b.lang)}</div>
      <div class="status-row">
        <select class="status-select" onchange="homeStatus('${b.id}',this.value)">
          <option value="toread" ${b.status==='toread'?'selected':''}>To Read</option>
          <option value="reading" ${b.status==='reading'?'selected':''}>Currently Reading</option>
          <option value="finished" ${b.status==='finished'?'selected':''}>Finished</option>
        </select>
        <span class="save-status" id="saveInd"></span>
      </div>
      <textarea id="notesArea" class="notes-editor" oninput="notesInput()" placeholder="Jot notes as you read…">${esc(b.notes)}</textarea>
      <div class="syntax-hint">${SYNTAX_HINT}</div>
      <div class="home-foot"><a onclick="setView('feed')">Read your finished notes →</a><a onclick="setView('library')">Manage library →</a></div>
    </div>`;
  } else {
    el.innerHTML=`<div class="wrap">
      <div class="page-head"><span class="eyebrow">Your next read?</span><button class="btn btn-ghost btn-sm" onclick="renderSuggest()">↻ Shuffle</button></div>
      <input class="search-bar" id="suggestSearch" placeholder="Search your to-read list…" oninput="renderSuggest()">
      <div id="suggestList" class="suggest-grid"></div>
    </div>`;
    renderSuggest();
  }
}
function homeSwitch(id){ homeReadingId=id; renderHome(); }
function homeStatus(id,val){ const b=books.find(x=>x.id===id); if(!b) return; b.status=val; saveLocal(); syncToFirestore(); homeReadingId=null; renderHome(); }

function renderSuggest(){
  const cont=document.getElementById('suggestList'); if(!cont) return;
  const q=(document.getElementById('suggestSearch').value||'').toLowerCase();
  let pool=books.filter(b=>b.status==='toread'&&(!q||b.title.toLowerCase().includes(q)||(b.author||'').toLowerCase().includes(q)));
  if(!q) pool=shuffle(pool).slice(0,8);
  if(!pool.length){ cont.innerHTML='<div class="feed-empty">No matching books in your to-read list.</div>'; return; }
  let html='', info=[];
  pool.forEach(b=>{
    const cid='cv_'+b.id, sid='sm_'+b.id;
    info.push({coverId:cid, summaryId:b.lang==='English'?sid:null, book:b});
    html+=`<article class="suggest-card" onclick="openInLibrary('${b.id}')">
      <div class="suggest-cover" id="${cid}">${esc((b.title||'?').charAt(0))}</div>
      <div class="suggest-body"><h3>${esc(b.title)}</h3><div class="meta">${esc(b.author)||'Unknown author'} &nbsp;·&nbsp; ${esc(b.lang)}</div>
      <div class="suggest-summary" id="${sid}">${b.lang==='English'?'Loading summary…':''}</div></div></article>`;
  });
  cont.innerHTML=html; hydrateBookInfo(info);
}

// ─── FEED ─────────────────────────────────────────────────
function renderFeed(){
  document.getElementById('viewFeed').innerHTML=`<div class="wrap">
    <div class="page-head"><span class="eyebrow">Notes from finished books</span><button class="btn btn-ghost btn-sm" onclick="renderFeedInto('feedList')">↻ Shuffle</button></div>
    <input class="search-bar" id="feedSearch" placeholder="Search your notes and finished books…" oninput="renderFeedInto('feedList')">
    <div id="feedList" class="feed"></div>
  </div>`;
  renderFeedInto('feedList');
}
function renderFeedInto(cid){
  const cont=document.getElementById(cid); if(!cont) return;
  const q=((document.getElementById('feedSearch')||{}).value||'').toLowerCase();
  let list=books.filter(b=>b.status==='finished'&&(!q||b.title.toLowerCase().includes(q)||(b.author||'').toLowerCase().includes(q)||(b.notes||'').toLowerCase().includes(q)));
  list=shuffle(list);
  if(!list.length){ cont.innerHTML=`<div class="feed-empty">No finished books match.</div>`; return; }
  let html='', covers=[];
  list.forEach(b=>{
    const fc='ff_'+b.id; covers.push({coverId:fc,book:b});
    html+=`<article class="feed-card">
      <div class="feed-top"><div class="feed-cover" id="${fc}">${esc((b.title||'?').charAt(0))}</div><div><h3>${esc(b.title)}</h3><div class="meta">${esc(b.author)||'Unknown author'} &nbsp;·&nbsp; ${esc(b.lang)}</div></div></div>
      ${hasNotes(b)?renderNotes(b.notes):'<div class="feed-none">No notes yet — open to add some.</div>'}
      <div class="feed-actions"><button class="btn btn-ghost btn-sm" onclick="openInLibrary('${b.id}')">Open / edit</button></div>
    </article>`;
  });
  cont.innerHTML=html; hydrateBookInfo(covers);
}
function openInLibrary(id){ setView('library'); selectBook(id,true); }

// ─── LIBRARY ──────────────────────────────────────────────
function renderLibrary(){ renderSidebar(); if(activeId&&books.find(b=>b.id===activeId)) renderBookDetail(); else libraryEmpty(); }
function libraryEmpty(){ document.getElementById('libEmpty').style.display='flex'; document.getElementById('bookDetail').style.display='none'; }

function renderSidebar(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const grps={reading:[],toread:[],finished:[]}, labs={reading:'Currently Reading',toread:'To Read',finished:'Finished'};
  books.forEach(b=>{ if(!q||b.title.toLowerCase().includes(q)||(b.author||'').toLowerCase().includes(q)){ if(grps[b.status]) grps[b.status].push(b); } });
  let html='';
  ['reading','toread','finished'].forEach(s=>{
    if(!grps[s].length) return;
    html+=`<div class="status-group"><div class="status-label">${labs[s]} (${grps[s].length})</div>`;
    grps[s].forEach(b=>{ html+=`<div class="book-item${b.id===activeId?' active':''}" onclick="selectBook('${b.id}')"><div class="book-item-info"><div class="book-item-title">${esc(b.title)}</div><div class="book-item-author">${esc(b.author)||'Unknown author'} ${hasNotes(b)?'<span class="note-dot">●</span>':''}</div></div><span class="badge badge-${b.status}">${s==='toread'?'To Read':s==='reading'?'Reading':'Done'}</span></div>`; });
    html+='</div>';
  });
  document.getElementById('sidebarList').innerHTML=html||'<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:14px;">No books found</div>';
}

function selectBook(id,forceEdit){ activeId=id; const b=books.find(x=>x.id===id); if(!b) return; editMode=forceEdit?true:(b.status!=='finished'); closeSidebar(); renderSidebar(); renderBookDetail(); }

function renderBookDetail(){
  const b=books.find(x=>x.id===activeId); if(!b){ libraryEmpty(); return; }
  document.getElementById('libEmpty').style.display='none';
  const detail=document.getElementById('bookDetail');
  detail.style.display='flex'; detail.style.flexDirection='column'; detail.style.gap='20px';
  const cid='cvD_'+b.id, sid='smD_'+b.id, showAbout=b.lang==='English';
  const hdr=`<div class="book-header"><div class="book-title-area"><h2>${esc(b.title)}</h2><div class="author">${esc(b.author)||'Unknown author'} &nbsp;·&nbsp; ${esc(b.lang)}</div></div>
    <div class="book-actions">
      <select class="status-select" onchange="changeStatus('${b.id}',this.value)">
        <option value="toread" ${b.status==='toread'?'selected':''}>To Read</option>
        <option value="reading" ${b.status==='reading'?'selected':''}>Currently Reading</option>
        <option value="finished" ${b.status==='finished'?'selected':''}>Finished</option>
      </select>
      ${editMode?`<button class="btn btn-ghost btn-sm" onclick="exitEdit()">Done</button>`:`<button class="btn btn-sm" onclick="enterEdit()">Edit</button>`}
      <button class="btn btn-ghost btn-sm" onclick="confirmDelete('${b.id}')">Delete</button>
    </div></div>`;
  const about=showAbout?`<div class="about-box"><div class="about-cover" id="${cid}">${esc((b.title||'?').charAt(0))}</div><div class="about-body"><div class="about-label">About this book</div><div class="about-summary" id="${sid}">Loading…</div></div></div>`:'';
  const body=editMode
    ?`<div class="note-section"><label>📝 Notes</label><textarea id="notesArea" class="notes-editor" oninput="notesInput()" placeholder="Write freely…">${esc(b.notes)}</textarea><div class="syntax-hint">${SYNTAX_HINT} <span class="save-status" id="saveStatus">Saves automatically</span></div></div>`
    :`<div class="note-section"><label>📝 Notes</label>${renderNotes(b.notes)}</div>`;
  detail.innerHTML=hdr+about+'<hr class="divider">'+body;
  if(showAbout) hydrateBookInfo([{coverId:cid,summaryId:sid,book:b}]);
}

function enterEdit(){ editMode=true; renderBookDetail(); }
function exitEdit(){ saveLocal(); syncToFirestore(); editMode=false; renderBookDetail(); renderSidebar(); }
function changeStatus(id,val){ const b=books.find(x=>x.id===id); if(!b) return; b.status=val; saveLocal(); editMode=val!=='finished'; renderBookDetail(); renderSidebar(); syncToFirestore(); }
function confirmDelete(id){ const b=books.find(x=>x.id===id); if(!b) return; if(!confirm(`Delete "${b.title}"? This cannot be undone.`)) return; books=books.filter(x=>x.id!==id); activeId=null; saveLocal(); renderSidebar(); libraryEmpty(); syncToFirestore(); }

// ─── ADD BOOK ─────────────────────────────────────────────
function openAddBook(){ document.getElementById('addModal').classList.add('open'); }
function closeAddBook(){ document.getElementById('addModal').classList.remove('open'); }
function addBook(){
  const title=document.getElementById('newTitle').value.trim(); if(!title){ alert('Please enter a title.'); return; }
  const b={id:uid(),title,author:document.getElementById('newAuthor').value.trim(),lang:document.getElementById('newLang').value,status:document.getElementById('newStatus').value,notes:''};
  books.unshift(b); saveLocal(); closeAddBook();
  document.getElementById('newTitle').value=''; document.getElementById('newAuthor').value='';
  syncToFirestore(); setView('library'); selectBook(b.id,true);
}

// ─── EXPORT / IMPORT ──────────────────────────────────────
function exportJson(){ const bl=new Blob([JSON.stringify(books,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(bl); a.download='books-backup.json'; a.click(); URL.revokeObjectURL(a.href); }
function importJson(ev){ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(Array.isArray(d)){ books=d; normalizeAll(); saveLocal(); syncToFirestore(); closeSetup(); setView(currentView); alert('Imported '+d.length+' books.'); } else alert('Invalid file.'); }catch(e){ alert('Could not parse JSON.'); } }; r.readAsText(f); }

// ─── DATA MODAL ───────────────────────────────────────────
function openSetup(){ setConnStatus(true); document.getElementById('setupModal').classList.add('open'); }
function closeSetup(){ document.getElementById('setupModal').classList.remove('open'); }

// ─── MOBILE SIDEBAR ───────────────────────────────────────
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
function closeSidebar(){ const sb=document.getElementById('sidebar'),ov=document.getElementById('sidebarOverlay'); if(sb) sb.classList.remove('open'); if(ov) ov.classList.remove('open'); }

init();
</script>
