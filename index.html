<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#fff; --surface:#f5f5f3; --border:#e8e8e8;
  --text:#111; --text-2:#444; --text-muted:#888;
  --accent-bg:#f0f0ee; --radius:4px;
  --shadow:0 1px 4px rgba(0,0,0,0.06); --max:1100px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
@supports(height:100dvh){body{height:100dvh;}}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:52px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;gap:20px;}
.brand{font-size:14px;font-weight:700;letter-spacing:-.3px;color:var(--text);white-space:nowrap;}
.nav{display:flex;gap:24px;}
.nav-btn{background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;padding:4px 0;margin-bottom:-1px;font-family:inherit;transition:color .15s,border-color .15s;}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--text);border-bottom-color:var(--text);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.icon-btn{background:none;border:1px solid var(--border);width:32px;height:32px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-muted);transition:background .12s;}
.icon-btn:hover{background:var(--surface);}
.add-btn{background:var(--text);color:#fff;border:none;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.add-btn:hover{opacity:.8;}

/* ── PAGES ── */
#content{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;display:none;}
.page.show{display:block;}
.container{max-width:var(--max);margin:0 auto;padding:0 32px;}

/* ── HOME: READING ── */
.home-reading{max-width:680px;margin:0 auto;padding:52px 32px 80px;}
.home-eyebrow{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:22px;}
.home-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.home-pill{border:1px solid var(--border);background:none;color:var(--text-muted);border-radius:100px;padding:5px 14px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s;}
.home-pill.active{border-color:var(--text);background:var(--text);color:#fff;}
.home-display-title{font-size:clamp(26px,4.5vw,52px);font-weight:700;letter-spacing:-1.5px;line-height:1.05;margin-bottom:10px;word-break:break-word;}
.home-display-author{font-size:16px;color:var(--text-muted);margin-bottom:24px;}
.home-status-row{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
.bare-select{background:none;border:none;border-bottom:1px solid var(--border);padding:4px 0;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;font-family:inherit;outline:none;}
.bare-select:focus{border-bottom-color:var(--text);}
.save-ind{font-size:12px;color:var(--text-muted);}
.save-ind.saved{color:#2a7a4a;}
.home-notes-area{width:100%;border:none;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:transparent;padding:20px 0;font-size:16px;line-height:2.0;font-family:inherit;color:var(--text);outline:none;resize:none;min-height:40vh;}
.home-notes-area::placeholder{color:#ccc;}
.syntax-hint{font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.7;}
.syntax-hint code{background:var(--surface);padding:1px 5px;border-radius:3px;font-size:11px;}
.home-foot{margin-top:20px;display:flex;gap:24px;}
.home-foot a{font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:color .12s;}
.home-foot a:hover{color:var(--text);}

/* ── HOME: SUGGESTIONS ── */
.home-suggest{padding:36px 0 80px;}
.suggest-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.suggest-eyebrow{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);}
.shuffle-btn{background:none;border:1px solid var(--border);padding:5px 12px;border-radius:var(--radius);font-size:12px;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:background .12s;}
.shuffle-btn:hover{background:var(--surface);}
.bare-search{width:100%;border:none;border-bottom:1px solid var(--border);background:transparent;padding:10px 0;font-size:14px;font-family:inherit;color:var(--text);outline:none;margin-bottom:28px;}
.bare-search:focus{border-bottom-color:var(--text);}
.empty-msg{color:var(--text-muted);font-size:14px;padding:40px 0;}

/* ── FEED ── */
.feed-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:36px 0 0;}
.feed-eyebrow{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);}
.feed-entry{padding:36px 0;border-top:1px solid var(--border);}
.feed-entry:first-of-type{border-top:none;}
.entry-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
.entry-title{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.15;margin-bottom:6px;}
.entry-author{font-size:14px;color:var(--text-muted);margin-bottom:20px;}
.entry-none{font-size:14px;color:var(--text-muted);font-style:italic;}
.entry-action{margin-top:18px;}
.text-link{background:none;border:none;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;padding:0;font-family:inherit;transition:color .12s;}
.text-link:hover{color:var(--text);}
.feed-empty{text-align:center;color:var(--text-muted);padding:80px 20px;font-size:15px;}

/* ── LIBRARY: GRID ── */
.lib-top{padding:36px 0 0;}
.lib-eyebrow{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:20px;}
.lib-toolbar{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);margin-bottom:28px;flex-wrap:wrap;}
.filter-btn{background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;padding:10px 14px;margin-bottom:-1px;font-family:inherit;white-space:nowrap;transition:color .15s,border-color .15s;}
.filter-btn:hover{color:var(--text);}
.filter-btn.active{color:var(--text);border-bottom-color:var(--text);}
.lib-search{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text);outline:none;flex:1;min-width:100px;margin-bottom:-1px;}
.lib-search:focus{border-bottom-color:var(--border);}
.lib-count{font-size:12px;color:var(--text-muted);padding:10px 14px;white-space:nowrap;}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:28px 20px;padding-bottom:60px;}
.grid-empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);font-size:15px;}

/* ── BOOK CARD ── */
.book-card{cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:opacity .15s;}
.book-card:hover{opacity:.72;}
.card-cover{aspect-ratio:2/3;background:var(--surface);border:1px solid var(--border);border-radius:3px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.card-letter{font-size:26px;font-weight:300;color:var(--text-muted);}
.card-reading-badge{position:absolute;top:8px;left:8px;background:#111;color:#fff;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 7px;border-radius:2px;}
.card-body{display:flex;flex-direction:column;gap:3px;}
.card-title{font-size:13px;font-weight:600;line-height:1.3;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-author{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-foot{display:flex;align-items:center;gap:5px;margin-top:2px;}
.card-status{font-size:11px;color:var(--text-muted);}
.card-dot{width:5px;height:5px;border-radius:50%;background:var(--text);flex-shrink:0;}

/* ── BOOK DETAIL ── */
.detail-wrap{max-width:720px;margin:0 auto;padding:32px 32px 80px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;font-size:13px;color:var(--text-muted);cursor:pointer;padding:0;font-family:inherit;margin-bottom:32px;transition:color .12s;}
.back-btn:hover{color:var(--text);}
.detail-meta{display:flex;gap:24px;margin-bottom:28px;}
.detail-cover{width:96px;flex-shrink:0;aspect-ratio:2/3;background:var(--surface);border:1px solid var(--border);border-radius:3px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:22px;font-weight:300;}
.detail-info{flex:1;display:flex;flex-direction:column;justify-content:flex-end;}
.detail-title{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2;margin-bottom:6px;}
.detail-author{font-size:14px;color:var(--text-muted);margin-bottom:16px;}
.detail-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.detail-edit-btn{background:var(--text);color:#fff;border:none;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.detail-edit-btn:hover{opacity:.8;}
.detail-edit-btn.ghost{background:none;color:var(--text-muted);border:1px solid var(--border);}
.detail-del{background:none;border:none;font-size:13px;color:var(--text-muted);cursor:pointer;font-family:inherit;padding:0;transition:color .12s;}
.detail-del:hover{color:#d44;}
.detail-about{margin-bottom:24px;padding:14px;background:var(--surface);border-radius:var(--radius);}
.detail-about-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:7px;}
.detail-about-text{font-size:13px;line-height:1.7;color:var(--text-2);}
.detail-divider{border:none;border-top:1px solid var(--border);margin-bottom:22px;}
.detail-notes-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;}
.detail-textarea{width:100%;border:none;border-top:1px solid var(--border);background:transparent;padding:18px 0;font-size:15px;line-height:1.9;font-family:inherit;color:var(--text);outline:none;resize:none;min-height:200px;}
.detail-hint-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap;}

/* ── NOTE DISPLAY ── */
.notes-view{display:flex;flex-direction:column;gap:14px;}
.nv-empty{color:var(--text-muted);font-style:italic;font-size:15px;}
.nv-note{font-size:15px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;}
.nv-note a{color:var(--text);text-decoration:underline;}
.nv-quote{font-size:15px;line-height:1.75;color:var(--text-2);padding:4px 0 4px 18px;border-left:2px solid var(--text);font-style:italic;white-space:pre-wrap;}
.nv-list{list-style:none;display:flex;flex-direction:column;gap:7px;}
.nv-list li{position:relative;padding-left:18px;font-size:15px;line-height:1.7;color:var(--text);word-wrap:break-word;overflow-wrap:anywhere;}
.nv-list li::before{content:'›';position:absolute;left:2px;top:-1px;font-weight:600;font-size:16px;}
.nv-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;color:var(--text);background:var(--surface);transition:background .12s;}
.nv-link:hover{background:var(--accent-bg);}
.nv-fav{width:16px;height:16px;flex-shrink:0;border-radius:2px;}
.nv-link-label{flex:1;font-size:13px;min-width:0;}
.nv-link-dom{font-size:11px;color:var(--text-muted);}

/* ── MODALS ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:8px;padding:28px;width:100%;max-width:480px;box-shadow:0 8px 40px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.modal-note{font-size:13px;color:var(--text-muted);line-height:1.6;}
.modal-field{display:flex;flex-direction:column;gap:6px;}
.modal-field label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;}
.modal-field input,.modal-field select{background:none;border:none;border-bottom:1px solid var(--border);padding:8px 0;font-size:14px;font-family:inherit;color:var(--text);outline:none;}
.modal-field input:focus,.modal-field select:focus{border-bottom-color:var(--text);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;flex-wrap:wrap;}
.modal-tools{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;}
.m-btn{background:var(--text);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.m-btn:hover{opacity:.8;}
.m-btn.ghost{background:none;color:var(--text-muted);border:1px solid var(--border);}
.m-btn.sm{padding:6px 12px;font-size:12px;}
.conn-status{font-size:13px;font-weight:500;padding:8px 12px;border-radius:var(--radius);background:var(--surface);}
.conn-ok{color:#2a7a4a;} .conn-err{color:#d44;}

/* ── MOBILE ── */
@media(max-width:720px){
  .topbar{padding:0 16px;gap:10px;}
  .brand{font-size:13px;}
  .nav{gap:16px;}
  .nav-btn{font-size:12px;}
  .add-btn{padding:6px 10px;font-size:12px;}
  .icon-btn{width:28px;height:28px;}
  .container{padding:0 16px;}
  .home-reading{padding:36px 16px 60px;}
  .home-suggest{padding:24px 0 60px;}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px 14px;}
  .detail-wrap{padding:20px 16px 60px;}
  .detail-title{font-size:18px;}
  .entry-title{font-size:22px;}
  .filter-btn{padding:10px 10px;font-size:12px;}
  .modal{padding:20px 16px;gap:12px;}
  input,select,textarea{font-size:16px !important;}
}
@media(max-width:380px){
  .nav-btn{font-size:11px;}
  .nav{gap:12px;}
  .book-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Reading Journal</div>
  <nav class="nav">
    <button class="nav-btn" data-view="home" onclick="setView('home')">Home</button>
    <button class="nav-btn" data-view="feed" onclick="setView('feed')">Notes</button>
    <button class="nav-btn" data-view="library" onclick="setView('library')">Library</button>
  </nav>
  <div class="topbar-right">
    <button class="icon-btn" onclick="openSetup()" title="Data">⚙</button>
    <button class="add-btn" onclick="openAddBook()">+ Add</button>
  </div>
</div>

<div id="content">
  <div id="viewHome" class="page"></div>
  <div id="viewFeed" class="page"></div>
  <div id="viewLibrary" class="page"></div>
</div>

<div class="overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">Add a Book</div>
    <div class="modal-field"><label>Title *</label><input type="text" id="newTitle" placeholder="Book title"></div>
    <div class="modal-field"><label>Author</label><input type="text" id="newAuthor" placeholder="Author name"></div>
    <div class="modal-field"><label>Language</label><select id="newLang"><option value="English">English</option><option value="Burmese">Burmese</option><option value="Other">Other</option></select></div>
    <div class="modal-field"><label>Status</label><select id="newStatus"><option value="toread">To Read</option><option value="reading">Currently Reading</option><option value="finished">Finished</option></select></div>
    <div class="modal-actions"><button class="m-btn ghost" onclick="closeAddBook()">Cancel</button><button class="m-btn" onclick="addBook()">Add Book</button></div>
  </div>
</div>

<div class="overlay" id="setupModal">
  <div class="modal">
    <div class="modal-title">Data</div>
    <p class="modal-note">Your books sync automatically to Firebase Firestore.</p>
    <div class="conn-status" id="connStatus">Checking connection…</div>
    <div class="modal-tools">
      <button class="m-btn ghost sm" onclick="exportJson()">⬇ Download backup</button>
      <button class="m-btn ghost sm" onclick="document.getElementById('importFile').click()">⬆ Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJson(event)">
    </div>
    <div class="modal-actions"><button class="m-btn ghost" onclick="closeSetup()">Close</button></div>
  </div>
</div>

<script>
// ─── FIREBASE ─────────────────────────────────────────────
const firebaseConfig = {

  authDomain:"reading-journal-d4839.firebaseapp.com",
  projectId:"reading-journal-d4839",
  storageBucket:"reading-journal-d4839.firebasestorage.app",
  messagingSenderId:"806612897171",
  appId:"1:806612897171:web:8e1efa2d49fd41dc73ac66"

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const DOC=db.collection('journal').doc('main');

// ─── STATE ────────────────────────────────────────────────
let books=[],currentView='home',activeId=null,editMode=false,homeReadingId=null,localSaveTimer=null;
let libMode='grid',libFilter='all';
const STORAGE_KEY='reading_journal_books', INFO_PREFIX='bk_info_v2_';

// ─── SEED ─────────────────────────────────────────────────
const seedBooks=[
  {id:uid(),title:"အိမ်မပြန်ဖြစ်တဲ့အကြောင်းတွေ",author:"လူခါး",lang:"Burmese",status:"finished",notes:"ဂျပန်ရောက်မြန်မာနိုင်ငံသားတစ်ဦးရဲ့ အတွေ့အကြုံများ\nဇာတ်ကားတစ်ပုဒ်လိုရေးထား\nPlot တင်ပြပုံကောင်း"},
  {id:uid(),title:"အနတ္တအင်နားရှား",author:"အေးမင်းစော",lang:"Burmese",status:"finished",notes:"မိဘတွေခေတ် ၁၉၅၀-၁၉၆၀ ဖွားတွေရဲ့ ဖြတ်သန်းမှုကိုလေ့လာနိုင်\nမြန်မာနိုင်ငံရဲ့ နေဝင်းအာဏာသိမ်းပြီး ဖြတ်သန်းမှု ခေတ်အဆက်ဆက်ကိုလေ့လာနိုင်"},

// ─── UTILS ────────────────────────────────────────────────
function uid(){return '_'+Math.random().toString(36).substr(2,9);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function domainOf(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hasNotes(b){return b.notes&&b.notes.trim();}

function normalize(b){
  if(Array.isArray(b.entries)){
    b.notes=b.entries.map(e=>{
      if(e.type==='quote') return(e.text||'').split('\n').map(x=>'> '+x).join('\n');
      if(e.type==='link') return'@ '+(e.url||'')+(e.text?' '+e.text:'');
      return e.text||'';
    }).filter(x=>x).join('\n');
    delete b.entries;return true;
  }
  if(b.notes===undefined){b.notes='';return true;}
  return false;
}
function normalizeAll(){let ch=false;books.forEach(b=>{if(normalize(b))ch=true;});if(ch)saveLocal();return ch;}

// ─── NOTE DISPLAY ─────────────────────────────────────────
const SYNTAX_HINT='<code>-</code> point &nbsp; <code>&gt;</code> quote &nbsp; <code>@ url description</code> link &nbsp; or just write';

function renderNotes(text){
  if(!text||!text.trim())return '<div class="nv-empty">No notes yet.</div>';
  const lines=text.split('\n');
  const isQ=l=>/^\s*>\s?/.test(l);
  const isL=l=>/^\s*@\s+/.test(l);
  const isI=l=>/^\s*-\s+/.test(l);
  let html='',i=0;
  while(i<lines.length){
    if(lines[i].trim()===''){ i++;continue;}
    if(isQ(lines[i])){
      const buf=[];
      while(i<lines.length&&isQ(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++;}
      html+=`<blockquote class="nv-quote">${linkify(buf.join('\n'))}</blockquote>`;
    }else if(isL(lines[i])){
      const rest=lines[i].replace(/^\s*@\s+/,'');i++;
      const m=rest.match(/(https?:\/\/[^\s]+)/);
      const url=m?m[1]:'';
      let label=rest.replace(url,'').replace(/^[\s|—–\-:]+|[\s|—–\-:]+$/g,'').trim();
      if(url){const dom=domainOf(url);if(!label)label=dom;
        html+=`<a class="nv-link" href="${esc(url)}" target="_blank" rel="noopener"><img class="nv-fav" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(dom)}&sz=64" alt=""><span class="nv-link-label">${esc(label)}</span><span class="nv-link-dom">${esc(dom)}</span></a>`;
      }else{html+=`<div class="nv-note">${linkify(rest)}</div>`;}
    }else if(isI(lines[i])){
      const items=[];
      while(i<lines.length&&isI(lines[i])){items.push(lines[i].replace(/^\s*-\s+/,''));i++;}
      html+=`<ul class="nv-list">${items.map(t=>`<li>${linkify(t)}</li>`).join('')}</ul>`;
    }else{
      const buf=[];
      while(i<lines.length&&lines[i].trim()!==''&&!isQ(lines[i])&&!isL(lines[i])&&!isI(lines[i])){buf.push(lines[i].replace(/^\s*[•\*▪◦·]\s*/,''));i++;}
      html+=`<div class="nv-note">${linkify(buf.join('\n'))}</div>`;
    }
  }
  return`<div class="notes-view">${html}</div>`;
}

// ─── BOOK INFO (Open Library) ─────────────────────────────
async function fetchBookInfo(b){
  const key=INFO_PREFIX+(b.title||'')+'|'+(b.author||'');
  try{const c=localStorage.getItem(key);if(c)return JSON.parse(c);}catch(e){}
  const res={cover:'',summary:''};
  try{
    const q=`title=${encodeURIComponent(b.title)}${b.author?`&author=${encodeURIComponent(b.author)}`:''}`;
    const r=await fetch(`https://openlibrary.org/search.json?${q}&limit=1&fields=cover_i,isbn,key,first_sentence`);
    const d=await r.json();const doc=d.docs&&d.docs[0];
    if(doc){
      if(doc.cover_i)res.cover=`https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`;
      else if(doc.isbn&&doc.isbn[0])res.cover=`https://covers.openlibrary.org/b/isbn/${doc.isbn[0]}-M.jpg`;
      if(doc.first_sentence&&doc.first_sentence[0])res.summary=doc.first_sentence[0];
      if(doc.key){try{const wr=await fetch(`https://openlibrary.org${doc.key}.json`);const wd=await wr.json();let desc=wd.description;if(desc&&typeof desc==='object')desc=desc.value;if(desc)res.summary=desc;}catch(e){}}
    }
    try{localStorage.setItem(key,JSON.stringify(res));}catch(e){}
  }catch(e){}
  return res;
}
async function hydrateBookInfo(items){
  for(const it of items){
    const info=await fetchBookInfo(it.book);
    if(it.coverId){const el=document.getElementById(it.coverId);if(el){if(info.cover){el.style.backgroundImage=`url("${info.cover}")`;const l=el.querySelector('.card-letter,.card-cover-letter,.detail-cover-letter');if(l)l.style.display='none';}}}
    if(it.summaryId){const el=document.getElementById(it.summaryId);if(el)el.textContent=info.summary||'No summary found on Open Library.';}
  }
}

// ─── FIRESTORE ────────────────────────────────────────────
async function syncToFirestore(){try{await DOC.set({books});}catch(e){console.error('Sync failed',e);}}
function setConnStatus(ok){const el=document.getElementById('connStatus');if(!el)return;el.textContent=ok?'Connected to Firestore ✓':'Offline — changes saved locally only';el.className='conn-status '+(ok?'conn-ok':'conn-err');}

// ─── INIT ─────────────────────────────────────────────────
async function init(){
  const stored=localStorage.getItem(STORAGE_KEY);
  if(stored)books=JSON.parse(stored);
  else books=seedBooks.map(b=>({...b}));
  normalizeAll();setView('home');
  try{
    const snap=await DOC.get();
    if(snap.exists){const data=snap.data();if(data.books&&data.books.length){books=data.books;normalizeAll();saveLocal();setView(currentView);}}
    else await syncToFirestore();
    setConnStatus(true);
  }catch(e){console.error('Firestore init failed',e);setConnStatus(false);}
}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(books));}
function scheduleSave(){
  const ind=document.getElementById('saveInd')||document.getElementById('saveStatus');
  if(ind){ind.textContent='Saving…';ind.className='save-ind';}
  clearTimeout(localSaveTimer);
  localSaveTimer=setTimeout(async()=>{saveLocal();await syncToFirestore();const i2=document.getElementById('saveInd')||document.getElementById('saveStatus');if(i2){i2.textContent='Saved ✓';i2.className='save-ind saved';}},600);
}

// ─── VIEW SWITCHING ───────────────────────────────────────
function setView(v){
  currentView=v;
  ['home','feed','library'].forEach(n=>document.getElementById('view'+cap(n)).classList.toggle('show',n===v));
  document.querySelectorAll('.nav-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===v));
  if(v==='home')renderHome();else if(v==='feed')renderFeed();else renderLibrary();
}
function editingBook(){const id=currentView==='home'?homeReadingId:activeId;return books.find(b=>b.id===id);}
function notesInput(){const b=editingBook();if(!b)return;const ta=document.getElementById('notesArea');if(ta)b.notes=ta.value;scheduleSave();}

    if(!homeReadingId||!reading.find(b=>b.id===homeReadingId))homeReadingId=reading[0].id;

    const pills=reading.length>1?`<div class="home-pills">${reading.map(r=>`<button class="home-pill ${r.id===homeReadingId?'active':''}" onclick="homeSwitch('${r.id}')">${esc(r.title)}</button>`).join('')}</div>`:'';

      <div class="home-status-row">
        <select class="bare-select" onchange="homeStatus('${b.id}',this.value)">
          <option value="toread" ${b.status==='toread'?'selected':''}>To Read</option>
          <option value="reading" ${b.status==='reading'?'selected':''}>Currently Reading</option>
          <option value="finished" ${b.status==='finished'?'selected':''}>Finished</option>

      <div class="home-foot"><a onclick="setView('feed')">Finished notes →</a><a onclick="setView('library')">Library →</a></div>
    </div>`;
  }else{
    el.innerHTML=`<div class="container"><div class="home-suggest">
      <div class="suggest-toolbar"><div class="suggest-eyebrow">Your next read</div><button class="shuffle-btn" onclick="renderSuggest()">↺ Shuffle</button></div>
      <input class="bare-search" id="suggestSearch" placeholder="Search your to-read list…" oninput="renderSuggest()">
      <div id="suggestList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 20px;"></div>
    </div></div>`;
    renderSuggest();
  }
}
function homeSwitch(id){homeReadingId=id;renderHome();}
function homeStatus(id,val){const b=books.find(x=>x.id===id);if(!b)return;b.status=val;saveLocal();syncToFirestore();homeReadingId=null;renderHome();}

function renderSuggest(){
  const cont=document.getElementById('suggestList');if(!cont)return;
  const q=(document.getElementById('suggestSearch').value||'').toLowerCase();
  let pool=books.filter(b=>b.status==='toread'&&(!q||b.title.toLowerCase().includes(q)||(b.author||'').toLowerCase().includes(q)));
  if(!q)pool=shuffle(pool).slice(0,10);
  if(!pool.length){cont.innerHTML='<div class="empty-msg">No matching books in your to-read list.</div>';return;}
  let html='',info=[];
  pool.forEach(b=>{
    const cid='sv_'+b.id;info.push({coverId:cid,book:b});
    html+=`<div class="book-card" onclick="openInLibrary('${b.id}')"><div class="card-cover" id="${cid}"><div class="card-letter">${esc((b.title||'?').charAt(0))}</div></div><div class="card-body"><div class="card-title">${esc(b.title)}</div><div class="card-author">${esc(b.author)||'Unknown'}</div></div></div>`;
  });
  cont.innerHTML=html;hydrateBookInfo(info);
}

// ─── FEED ─────────────────────────────────────────────────
function renderFeed(){
  document.getElementById('viewFeed').innerHTML=`<div class="container">
    <div class="feed-header"><div class="feed-eyebrow">Notes from finished books</div><button class="shuffle-btn" onclick="renderFeedList()">↺ Shuffle</button></div>
    <input class="bare-search" id="feedSearch" placeholder="Search books and notes…" oninput="renderFeedList()" style="margin-top:16px;">
    <div id="feedList"></div>
  </div>`;
  renderFeedList();
}
function renderFeedList(){
  const cont=document.getElementById('feedList');if(!cont)return;
  const q=((document.getElementById('feedSearch')||{}).value||'').toLowerCase();
  let list=books.filter(b=>b.status==='finished'&&(!q||b.title.toLowerCase().includes(q)||(b.author||'').toLowerCase().includes(q)||(b.notes||'').toLowerCase().includes(q)));
  list=shuffle(list);
  if(!list.length){cont.innerHTML='<div class="feed-empty">No finished books yet.</div>';return;}
  cont.innerHTML=list.map(b=>`<div class="feed-entry">
    <div class="entry-label">Finished &nbsp;·&nbsp; ${esc(b.lang)}</div>
    <div class="entry-title">${esc(b.title)}</div>
    <div class="entry-author">${esc(b.author)||'Unknown author'}</div>
    ${hasNotes(b)?renderNotes(b.notes):'<div class="entry-none">No notes yet.</div>'}
    <div class="entry-action"><button class="text-link" onclick="openInLibrary('${b.id}')">Open in Library ↗</button></div>
  </div>`).join('');
}

// ─── LIBRARY ──────────────────────────────────────────────
function renderLibrary(){if(libMode==='detail'&&activeId)renderLibDetail();else renderLibGrid();}

function renderLibGrid(){
  document.getElementById('viewLibrary').innerHTML=`<div class="container">
    <div class="lib-top"><div class="lib-eyebrow">Library</div>
    <div class="lib-toolbar">
      ${['all','reading','toread','finished'].map(f=>`<button class="filter-btn ${libFilter===f?'active':''}" onclick="setLibFilter('${f}')">${f==='all'?'All':f==='toread'?'To Read':cap(f)}</button>`).join('')}
      <input class="lib-search" id="libSearch" placeholder="Search…" oninput="renderBookGrid()">
      <span class="lib-count" id="libCount"></span>
    </div></div>
    <div class="book-grid" id="bookGrid"></div>
  </div>`;
  renderBookGrid();
}

function setLibFilter(f){libFilter=f;renderLibGrid();}

function renderBookGrid(){
  const cont=document.getElementById('bookGrid');if(!cont)return;
  const q=((document.getElementById('libSearch')||{}).value||'').toLowerCase();
  let list=books.filter(b=>{
    if(libFilter!=='all'&&b.status!==libFilter)return false;
    if(q&&!b.title.toLowerCase().includes(q)&&!(b.author||'').toLowerCase().includes(q))return false;
    return true;
  });
  const cnt=document.getElementById('libCount');if(cnt)cnt.textContent=`${list.length} book${list.length!==1?'s':''}`;
  if(!list.length){cont.innerHTML='<div class="grid-empty">No books match.</div>';return;}
  let html='',covers=[];
  list.forEach(b=>{
    const cid='gc_'+b.id;covers.push({coverId:cid,book:b});
    const badge=b.status==='reading'?`<div class="card-reading-badge">Reading</div>`:'';
    const statusTxt=b.status==='toread'?'To read':b.status==='finished'?'Finished':'';
    html+=`<div class="book-card" onclick="openBook('${b.id}')">
      <div class="card-cover" id="${cid}">${badge}<div class="card-letter">${esc((b.title||'?').charAt(0))}</div></div>
      <div class="card-body">
        <div class="card-title">${esc(b.title)}</div>
        <div class="card-author">${esc(b.author)||'Unknown'}</div>
        <div class="card-foot"><span class="card-status">${statusTxt}</span>${hasNotes(b)?'<span class="card-dot"></span>':''}</div>
      </div></div>`;
  });
  cont.innerHTML=html;hydrateBookInfo(covers);
}

function openBook(id){
  activeId=id;const b=books.find(x=>x.id===id);if(!b)return;
  editMode=b.status!=='finished';libMode='detail';renderLibDetail();
}
function backToGrid(){libMode='grid';activeId=null;renderLibGrid();}

function renderLibDetail(){
  const b=books.find(x=>x.id===activeId);if(!b){libMode='grid';renderLibGrid();return;}
  const el=document.getElementById('viewLibrary');
  const cid='ld_'+b.id,sid='ls_'+b.id,showAbout=b.lang==='English';
  const about=showAbout?`<div class="detail-about"><div class="detail-about-label">About</div><div class="detail-about-text" id="${sid}">Loading…</div></div>`:'';
  const body=editMode
    ?`<div class="detail-notes-label">📝 Notes</div>
      <textarea id="notesArea" class="detail-textarea" oninput="notesInput()" placeholder="Write freely…">${esc(b.notes)}</textarea>
      <div class="detail-hint-row"><span class="syntax-hint">${SYNTAX_HINT}</span><span class="save-ind" id="saveStatus">Saves automatically</span></div>`
    :`<div class="detail-notes-label">📝 Notes</div>${renderNotes(b.notes)}`;
  el.innerHTML=`<div class="detail-wrap">
    <button class="back-btn" onclick="backToGrid()">← All books</button>
    <div class="detail-meta">
      <div class="detail-cover" id="${cid}">${esc((b.title||'?').charAt(0))}</div>
      <div class="detail-info">
        <div class="detail-title">${esc(b.title)}</div>
        <div class="detail-author">${esc(b.author)||'Unknown author'} &nbsp;·&nbsp; ${esc(b.lang)}</div>
        <div class="detail-actions">
          <select class="bare-select" onchange="changeStatus('${b.id}',this.value)">
            <option value="toread" ${b.status==='toread'?'selected':''}>To Read</option>
            <option value="reading" ${b.status==='reading'?'selected':''}>Currently Reading</option>
            <option value="finished" ${b.status==='finished'?'selected':''}>Finished</option>
          </select>
          ${editMode?`<button class="detail-edit-btn ghost" onclick="exitEdit()">Done</button>`:`<button class="detail-edit-btn" onclick="enterEdit()">Edit</button>`}
          <button class="detail-del" onclick="confirmDelete('${b.id}')">Delete</button>
        </div>
      </div>
    </div>
    ${about}<hr class="detail-divider">${body}
  </div>`;
  if(showAbout)hydrateBookInfo([{coverId:cid,summaryId:sid,book:b}]);
}

function openInLibrary(id){activeId=id;const b=books.find(x=>x.id===id);if(b)editMode=b.status!=='finished';libMode='detail';setView('library');}
function enterEdit(){editMode=true;renderLibDetail();}
function exitEdit(){saveLocal();syncToFirestore();editMode=false;renderLibDetail();}
function changeStatus(id,val){const b=books.find(x=>x.id===id);if(!b)return;b.status=val;saveLocal();editMode=val!=='finished';renderLibDetail();syncToFirestore();}
function confirmDelete(id){const b=books.find(x=>x.id===id);if(!b)return;if(!confirm(`Delete "${b.title}"?`))return;books=books.filter(x=>x.id!==id);activeId=null;libMode='grid';saveLocal();renderLibGrid();syncToFirestore();}

// ─── ADD BOOK ─────────────────────────────────────────────
function openAddBook(){document.getElementById('addModal').classList.add('open');}
function closeAddBook(){document.getElementById('addModal').classList.remove('open');}
function addBook(){
  const title=document.getElementById('newTitle').value.trim();if(!title){alert('Please enter a title.');return;}
  const b={id:uid(),title,author:document.getElementById('newAuthor').value.trim(),lang:document.getElementById('newLang').value,status:document.getElementById('newStatus').value,notes:''};
  books.unshift(b);saveLocal();closeAddBook();
  document.getElementById('newTitle').value='';document.getElementById('newAuthor').value='';
  syncToFirestore();activeId=b.id;libMode='detail';editMode=true;setView('library');
}

// ─── EXPORT / IMPORT ──────────────────────────────────────
function exportJson(){const bl=new Blob([JSON.stringify(books,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='books-backup.json';a.click();URL.revokeObjectURL(a.href);}
function importJson(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){books=d;normalizeAll();saveLocal();syncToFirestore();closeSetup();setView(currentView);alert('Imported '+d.length+' books.');}else alert('Invalid file.');}catch(e){alert('Could not parse JSON.');}};r.readAsText(f);}

// ─── DATA MODAL ───────────────────────────────────────────
function openSetup(){setConnStatus(true);document.getElementById('setupModal').classList.add('open');}
function closeSetup(){document.getElementById('setupModal').classList.remove('open');}

init();
</script>
</body>
</html>
